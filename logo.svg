<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Devaraj J portfolio icon</title>
  <desc id="desc">A geometric DJ monogram with a luminous orbit on a midnight background.</desc>
  <defs>
    <linearGradient id="orbit" x1="15" y1="102" x2="113" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7658ff"/>
      <stop offset=".54" stop-color="#547fff"/>
      <stop offset="1" stop-color="#68eaff"/>
    </linearGradient>
    <linearGradient id="j-gradient" x1="58" y1="33" x2="91" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bff"/>
      <stop offset="1" stop-color="#4b8dff"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="matrix(0 76 -78 0 64 44)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244a91" stop-opacity=".72"/>
      <stop offset="1" stop-color="#070b18" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
