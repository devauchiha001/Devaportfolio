  <path d="M13 81C29 54 65 43 99 52c8 2 14 5 18 9" fill="none" stroke="url(#orbit)" stroke-width="3.2" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M14 81C35 96 71 94 98 78c9-5 15-11 19-17" fill="none" stroke="url(#orbit)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
